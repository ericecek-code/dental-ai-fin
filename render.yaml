# Render Blueprint — jednoklikový deploy z GitHub repozitára.
# https://render.com/deploy?repo=https://github.com/ericecek-code/dental-ai-fin
#
# POZOR na pamäť: yolov8x (368 MB váh) + PyTorch potrebujú ~1,5 GB RAM.
# Free tier aj "starter" (512 MB) pri prvom /analyze spadnú na OOM.
# Preto "standard" (2 GB). Ak chceš len UI bez analýzy, zníž na "starter".
services:
  - type: web
    name: dental-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Bez kľúča: API_TOKEN sa nenastavuje -> AuthMiddleware je vypnutá (verejné demo).
      # Pred produkčným nasadením doplň API_TOKEN a CORS_ORIGINS s konkrétnou doménou.
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_MAX_SIZE_MB
        value: "50"

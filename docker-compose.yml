services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/tmp/dental-ai
      - MODEL_PATH=/app/backend/weights/yolov8x_dental.pt
      - CORS_ORIGINS=["http://localhost:8000","http://127.0.0.1:8000"]
      # API_TOKEN nechajte prázdny pre lokálny vývoj; v produkcii ho nastavte.
      - API_TOKEN=${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
